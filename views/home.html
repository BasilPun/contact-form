<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="icon" href="../images/wave.png">
</head>
<body>
    <main>
        <h1>Contact Form</h1>
        <form id="contact-form">
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname">
            <span class="err" id="err-fname">First name is required</span>

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname">
            <span class="err" id="err-lname">Last name is required</span>

            <label for="job-title">Job Title</label>
            <input type="text" id="job-title" name="job-title">

            <label for="company">Company</label>
            <input type="text" id="company" name="company">

            <label for="linkedin">LinkedIn URL</label>
            <input type="url" id="linkedin" name="linkedin">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email">

            <label for="met">How did we meet?</label>
            <select id="met" name="met">
                <option value="none">Please Select</option>
                <option value="school">School</option>
                <option value="work">Work</option>
                <option value="other">Other</option>
            </select>

            <label for="met-other">Other (Please Specify)</label>
            <input type="text" id="met-other" name="met-other">

            <label for="message">Message</label>
            <textarea rows="5" id="message" name="message"></textarea>

            <label for="mailing-list">
                <input type="checkbox" id="mailing-list" name="mailing-list" value="yes">
                Add me to your mailing list?
            </label>

            <fieldset>
                <legend>Choose an email format:</legend>

                <label for="format-html">
                    <input type="radio" id="format-html" name="email-format" value="html">
                    HTML
                </label>

                <label for="format-text">
                    <input type="radio" id="format-text" name="email-format" value="text">
                    Text
                </label>
            </fieldset>

            <button type="submit" id="submit-button">Submit</button>
        </form>
    </main>
</body>
</html>
